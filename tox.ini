[tox]
envlist = py38, py39, py310, py311, lint, type, cov

[testenv]
description = Run tests with pytest
deps = 
    pytest
    pytest-cov
    -rrequirements.txt
commands = 
    pytest {posargs:tests} --cov=digitalplat_auto_register --cov-report=term-missing

[testenv:lint]
description = Run linting checks
deps =
    black
    flake8
    isort
commands =
    black --check src/ tests/
    flake8 src/ tests/
    isort --check-only src/ tests/

[testenv:type]
description = Run type checking
deps =
    mypy
    -rrequirements.txt
commands = 
    mypy src/

[testenv:cov]
description = Generate coverage report
deps =
    pytest
    pytest-cov
    coverage[toml]
    -rrequirements.txt
commands =
    pytest tests/ --cov=digitalplat_auto_register --cov-report=html --cov-report=term
    coverage html
    coverage report

[testenv:docs]
description = Generate documentation
deps =
    sphinx
    sphinx-rtd-theme
commands =
    sphinx-build docs/ docs/_build/

[flake8]
max-line-length = 88
extend-ignore = E203, W503

[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true

[mypy]
python_version = 3.8
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true