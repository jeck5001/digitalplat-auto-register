<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DigitalPlat{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_version() }}">
{% block extra_head %}{% endblock %}
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-dot"></span>
      DigitalPlat
    </a>

    <nav>
      <div class="nav-section">
        <div class="nav-label">注册</div>
        <a class="nav-item{% if active_page == 'console' %} active{% endif %}" href="/">
          <span class="nav-icon">&#9672;</span>
          控制台
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">域名</div>
        <a class="nav-item{% if active_page == 'domain' %} active{% endif %}" href="/domain-automation">
          <span class="nav-icon">&#9635;</span>
          API 自动化
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-label">系统</div>
        <a class="nav-item{% if active_page == 'pool' %} active{% endif %}" href="/pool-dashboard">
          <span class="nav-icon">&#9673;</span>
          账户池
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      v0.1.0
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>

<script src="/static/js/api.js?v={{ asset_version() }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
