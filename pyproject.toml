[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalplat-auto-register"
dynamic = ["version"]
description = "Automated DigitalPlat domain registration with temporary email verification"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Auto-generated", email = "auto@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.45.0,<1.61.0",
    "camoufox>=0.5.4",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "fake-useragent>=1.5.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx2>=0.1.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.991",
    "pre-commit>=2.20",
]

[project.scripts]
digitalplat-register = "digitalplat_auto_register.cli:main"
digitalplat-register-web = "digitalplat_auto_register.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["digitalplat_auto_register", "digitalplat_auto_register.*"]

[tool.setuptools.dynamic]
version = { attr = "digitalplat_auto_register.__version__" }

[tool.setuptools.package-data]
digitalplat_auto_register = ["py.typed", "*.yaml", "*.yml", "*.toml"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: Integration tests that require external services",
    "unit: Unit tests for internal components",
    "browser: Tests requiring browser automation",
]
